<!DOCTYPE html>
<html>
<head><title>Pension Scheme Registration</title></head>
<body style="font-family:sans-serif; padding:20px;">
<h2>👴 Government Pension Scheme</h2>
<form id="regForm">
    <label>Beneficiary Name:</label><input type="text" id="name"><br>
    <label>Father/Husband Name:</label><input type="text" id="father_name"><br>
    <label>Mobile:</label><input type="tel" id="mobile"><br>
    <label>Aadhaar Last 4:</label><input type="text" id="aadhaar_last4"><br>
    <label>Village:</label>
    <select id="village">
        <option value="ward1">Ward 1 - Rampur</option>
        <option value="ward4">Ward 4 - Sonpur</option>
        <option value="ward7">Ward 7 - Lakhisarai</option>
    </select><br>
    <label>Upload Supporting Doc (Death Cert/Age Proof):</label>
    <input type="file" id="doc_upload"><br><br>
    <button type="submit">Verify & Submit</button>
</form>
<div id="result" style="display:none; margin-top:20px; color:green; font-weight:bold;">
    Success! ID: <span id="app-id"></span>
</div>
<script>
document.getElementById('regForm').onsubmit = function(e){
    e.preventDefault();
    const id = 'PEN-' + Math.floor(Math.random()*100000);
    document.getElementById('app-id').innerText = id;
    document.getElementById('result').style.display = 'block';
};
</script>
</body>
</html>
