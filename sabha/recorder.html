<!doctype html><meta charset=utf-8>
<title>Haq Setu - Sabha Recorder</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#111}
 .consent{background:#fff7e6;border:1px solid #f0c36d;padding:10px 14px;border-radius:8px;margin-bottom:14px}
 .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
 input,select,button{padding:8px;border:1px solid #bbb;border-radius:6px;font-size:14px}
 button{cursor:pointer;background:#14532d;color:#fff;border-color:#14532d}
 button.sec{background:#fff;color:#14532d}
 pre{background:#0b1020;color:#d6e2ff;padding:12px;border-radius:8px;overflow:auto;font-size:12px}
 .pill{display:inline-block;background:#e8f5e9;color:#1b5e20;border-radius:999px;padding:2px 10px;font-size:12px}
 .bad{background:#fdecea;color:#b71c1c}
</style>
<div class=consent><b>Consent:</b> this meeting is being recorded and transcribed for the
official Gram Sabha record. Speak your role, not private details. Recordings are held in
memory only and destroyed after transcription.</div>
<div class=row>
 <input id=api value=http://127.0.0.1:8020 size=24 placeholder=API base>
 <input id=gp value=GP-SEAM placeholder=GP id>
 <input id=date value=2026-10-21 placeholder=YYYY-MM-DD>
 <select id=lang><option value=hi>hi</option><option value=en>en</option><option value=bn>bn</option></select>
</div>
<div class=row>
 <button id=start>&#9679; Start chunk</button>
 <button id=stop class=sec>&#9632; Stop &amp; upload</button>
 <span id=idx class=pill>chunk 0</span>
</div>
<div class=row>
 <button id=tr>Transcribe staged audio</button>
 <button id=sign class=sec>Sign &amp; push to SDM</button>
 <button id=refuse class=sec>Refuse to sign</button>
</div>
<pre id=out>(idle)</pre>
<script>
const $=id=>document.getElementById(id);
let mr=null, chunks=[], idx=0, lastMinutes=null;
const log=o=>$().out.textContent = (typeof o==='string'?o:JSON.stringify(o,null,2));
async function sha256Hex(buf){const h=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
function b64(buf){let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
$('start').onclick=async()=>{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  mr=new MediaRecorder(stream); chunks=[];
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  mr.onstop=async()=>{
    const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
    const buf=await blob.arrayBuffer();
    const localHash=await sha256Hex(buf);
    const r=await fetch($('api').value+'/record',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({gp:$('gp').value,date:$('date').value,chunk_index:idx,audio_b64_chunk:b64(buf)})});
    const j=await r.json();
    const match=j.chunk_hash===localHash;
    log({uploaded_chunk:idx,server_hash:j.chunk_hash,local_hash:localHash,match:match?'OK':'MISMATCH',bytes:j.bytes,stage_token:j.stage_token});
    idx++; $('idx').textContent='chunk '+idx;
    stream.getTracks().forEach(t=>t.stop());
  };
  mr.start(); log('recording... press Stop & upload');
};
$('stop').onclick=()=>{if(mr&&mr.state!=='inactive')mr.stop();};
$('tr').onclick=async()=>{
  const r=await fetch($('api').value+'/transcribe',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({gp:$('gp').value,date:$('date').value,lang:$('lang').value})});
  const j=await r.json();
  if(j.abstain){log({ABSTAIN:true,reason:j.reason});lastMinutes=null;return;}
  lastMinutes=j.minutes; log(j);
};
function sign(signed,reason){
  if(!lastMinutes){log('transcribe first');return;}
  fetch($('api').value+'/sign',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({minutes:lastMinutes,signed:signed,signer_role:'sarpanch',refuse_reason:reason,open_civic:true})})
   .then(r=>r.json()).then(log);
}
$('sign').onclick=()=>sign(true,null);
$('refuse').onclick=()=>{const rs=prompt('refusal reason (e.g. quorum_not_met)','quorum_not_met');if(rs)sign(false,rs);};
</script>
